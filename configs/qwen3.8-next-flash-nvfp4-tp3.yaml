recipe_version: "1"
name: Qwen3.8-Flash-Next-NVFP4-TP3
description: Qwen 3.8 Flash Next (~180B MoE) in NVFP4 format on 3x DGX Spark (TP=3) with native MTP

model: RadixArk/Qwen3.8-Flash-Next-NVFP4
container: vllm-node-b12x

defaults:
  port: 8100
  host: 0.0.0.0
  tensor_parallel: 3
  gpu_memory_utilization: 0.80
  max_model_len: 32768
  max_num_seqs: 16
  max_num_batched_tokens: 8192
  block_size: 256
  num_speculative_tokens: 1

env:
  CUTE_DSL_ARCH: "sm_121a"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
  VLLM_USE_MEGA_AOT_ARTIFACT: "-1"
  VLLM_MEMORY_PROFILE_INCLUDE_ATTN: "1"
  VLLM_USE_FLASHINFER_SAMPLER: "1"
  VLLM_USE_B12X_WO_PROJECTION: "1"
  VLLM_USE_B12X_MHC: "1"
  VLLM_USE_B12X_FP8_GEMM: "1"
  VLLM_USE_B12X_MOE: "1"
  VLLM_USE_B12X_SPARSE_INDEXER: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_MOE_SKIP_PADDING: "0"

command: |
  vllm serve RadixArk/Qwen3.8-Flash-Next-NVFP4 \
    --host {host} \
    --port {port} \
    --served-model-name qwen3.8-flash-next-nvfp4 qwen3.8-flash-next \
    --tensor-parallel-size {tensor_parallel} \
    --trust-remote-code \
    --kv-cache-dtype fp8 \
    --moe-backend b12x \
    --attention-backend flashinfer \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --enable-chunked-prefill \
    --async-scheduling \
    --enable-prefix-caching \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":{num_speculative_tokens}}}' \
    --load-format safetensors \
    --reasoning-parser qwen3 \
    --tool-call-parser qwen3_xml \
    --enable-auto-tool-choice \
    --max-cudagraph-capture-size 32
